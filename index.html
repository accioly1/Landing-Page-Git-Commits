<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
     integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Slash</title>
</head>
<body>

     <header>
        <nav id="bar">
            <i class="fa-solid fa-gamepad" id="nav_logo"> SLASH</i> <!-- Nome do site e logo-->

            <ul id="nav_list"> <!--Barra de navegação desktop-->
                <li class="nav-item active">
                    <a href="#home">Início</a>
                </li>
                <li class="nav-item">
                    <a href="#menu">Produtos</a>
                </li>
                <li class="nav-item">
                    <a href="#help">Ajuda</a>
                </li>
            </ul>

            <button class="btn-default">

                <div id="cta_buttons">
                    <a href="#menu" class="btn-default">
                        Compre agora
                    </a>
                </div>
            </button> <!--Barra de navegação desktop-->

             <button id="mobile_btn"> <!--Barra de navegação mobile-->
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
        <div id="mobile_menu">
            <ul id="mobile_nav_list">
                <li class="nav-item">
                    <a href="#home">Início</a>
                </li>
                <li class="nav-item">
                    <a href="#menu">Produtos</a>
                </li>
                <li class="nav-item">
                    <a href="#help">Ajuda</a>
                </li>
            </ul>

            <button class="btn-default">

                <div id="cta_buttons">
                    <a href="#menu" class="btn-default">
                        Compre agora
                    </a>
                </div>
            </button>
        </div><!--Barra de navegação mobile-->

        <!--Código do "ScrollSpy"-->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const sections = document.querySelectorAll('section');
                const navItems = document.querySelectorAll('.nav-item');

                function activateNavItem() {
                    let current = '';

                    sections.forEach((section) => {
                        const sectionTop = section.offsetTop;
                        const sectionHeight = section.clientHeight;

                        if (pageYOffset >= sectionTop - sectionHeight / 3) {
                            current = section.getAttribute('id');
                        }
                    });

                    navItems.forEach((li) => {
                        li.classList.remove('active');
                        const link = li.querySelector('a');
                        if (link.getAttribute('href') === '#' + current) {
                            li.classList.add('active');
                        }
                    });
                }

                window.addEventListener('scroll', activateNavItem);
            });
        </script>
        <!--Código do "ScrollSpy"-->
    </header>

     <main id="content">
        <section id="home"> <!--Sessão Home/Ínicio-->
            <div class="shape"></div>
            <div id="cta">
                <h1 class="title">
                    Só aqui você encontra os melhores
                    <span>descontos</span>
                </h1>

                <p class="description">
                    Equipe seu setup com estilo, rapidez e economia.
                    Aproveite as ofertas antes que o loot acabe!
                </p>

                <div id="cta_buttons">
                    <a href="#menu" class="btn-default">
                        Ver produtos
                    </a>
                </div>
            </div>

            <div id="banner">
                <img src="src/styles/images/teste tudo branco top.png" alt="">
            </div>



        </section> <!--Sessão Home/Ínicio-->

         <section id="menu"> <!--Sessão dos Produtos/Carrossel de Imagens-->

            <div class="slider"> <!--Código Carrossel de Imagens-->

                <input type="radio" name="radio-btn" id="radio1">
                <input type="radio" name="radio-btn" id="radio2">
                <input type="radio" name="radio-btn" id="radio3">

                <div class="slides">


                    <div class="slide first">
                        <img src="src/styles/images/Design sem nome.png" alt="Imagem 1">

                    </div>
                    <div class="slide">
                        <img src="src/styles/images/2.png" alt="Imagem 2">

                    </div>
                    <div class="slide">
                        <img src="src/styles/images/3.png" alt="Imagem 3">

                    </div>



                </div>

                <div class="navigation-auto">

                    <div class="auto-btn1"></div>
                    <div class="auto-btn2"></div>
                    <div class="auto-btn3"></div>
                </div>

                <div class="manual-navigation">
                    <label for="radio1" class="manual-btn"></label>
                    <label for="radio2" class="manual-btn"></label>
                    <label for="radio3" class="manual-btn"></label>
                </div>


            </div> <!--Código Carrossel de Imagens-->






            <script src="javascript/script.js"></script>
    
</body>
</html>
